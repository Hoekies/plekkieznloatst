<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PointRush — Premium Mobile Game Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --purple-deep: #2a0f5e;
    --purple-mid: #4c1d95;
    --purple-light: #7C3AED;
    --orange: #FF8A00;
    --orange-light: #FFB23E;
    --gold: #FFD93B;
    --gold-light: #FFF1A8;
    --gold-dark: #C98800;
    --pink: #FF3B7A;
    --ink: #1B0E33;
    --font-display: "Baloo 2", sans-serif;
    --font-body: "Inter", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: #0a0515;
    color: #fff;
  }
  .section-label {
    text-align: center;
    color: #9C8BC4;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.1rem;
    padding: 36px 0 14px;
  }
  .frame {
    max-width: 460px;
    margin: 0 auto 60px;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 24px 70px rgba(0,0,0,0.7);
    border: 1px solid rgba(255,255,255,0.08);
  }

  /* ====== STAGE ====== */
  .stage {
    height: 780px;
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse 90% 60% at 50% 18%, rgba(255,138,0,0.25) 0%, transparent 60%),
      radial-gradient(circle at 50% 100%, var(--purple-mid) 0%, var(--purple-deep) 55%, #0c0322 100%);
    overflow: hidden;
  }
  .stage::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 26px);
    pointer-events: none;
  }

  /* floating sparkles */
  .sparkle {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, rgba(255,255,255,0) 70%);
    pointer-events: none;
    animation: sparkle-float 4.5s ease-in-out infinite;
  }
  @keyframes sparkle-float {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.25; }
    50%      { transform: translateY(-18px) scale(1.4); opacity: 0.9; }
  }
  .orb {
    position: absolute;
    font-size: 1.9rem;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
    animation: orb-bob 3.2s ease-in-out infinite;
  }
  @keyframes orb-bob {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50%      { transform: translateY(-14px) rotate(4deg); }
  }

  /* glow pulse behind logo */
  .logo-glow {
    position: absolute;
    width: 280px; height: 280px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,217,59,0.45) 0%, rgba(124,58,237,0.25) 45%, transparent 75%);
    filter: blur(8px);
    animation: glow-pulse 2.6s ease-in-out infinite;
    z-index: 1;
  }
  @keyframes glow-pulse {
    0%, 100% { transform: scale(0.92); opacity: 0.7; }
    50%      { transform: scale(1.06); opacity: 1; }
  }

  /* ====== LOGO BANNER (pops above panel) ====== */
  .logo-wrap {
    position: relative; z-index: 3;
    animation: logo-idle 3.6s ease-in-out infinite;
  }
  @keyframes logo-idle {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-6px) rotate(-1deg); }
  }
  .logo-wrap img {
    width: 230px;
    filter: drop-shadow(0 18px 30px rgba(0,0,0,0.55)) drop-shadow(0 0 30px rgba(255,217,59,0.25));
  }

  /* ====== PREMIUM PANEL ====== */
  .panel {
    position: relative; z-index: 2;
    width: 100%; max-width: 360px;
    margin-top: -34px;
    border-radius: 26px;
    padding: 3px;
    background: linear-gradient(160deg, #ffe9a8 0%, var(--gold-dark) 50%, #8a5c00 100%);
    box-shadow: 0 24px 50px rgba(0,0,0,0.55), 0 2px 0 rgba(255,255,255,0.4) inset;
  }
  .panel-inner {
    border-radius: 23px;
    background: linear-gradient(165deg, #2f1769 0%, #1c0c45 60%, #150a36 100%);
    padding: 46px 22px 24px;
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,0.08),
      inset 0 -30px 50px rgba(0,0,0,0.35);
  }

  .field-label {
    font-family: var(--font-display); font-weight: 600;
    font-size: 0.78rem; color: #C9B6FF; margin-bottom: 6px; display: block;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .field-input {
    width: 100%; padding: 13px 16px; margin-bottom: 16px;
    border-radius: 12px; border: none;
    background: #150a30;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.6), inset 0 0 0 1.5px rgba(124,58,237,0.4);
    font-family: var(--font-body); font-size: 0.95rem; color: #fff;
  }
  .field-input::placeholder { color: rgba(255,255,255,0.32); }

  /* glossy 3D button with sweeping shine */
  .btn-premium {
    position: relative;
    width: 100%;
    border: none;
    border-radius: 16px;
    padding: 17px 0;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.12rem;
    color: #fff;
    text-shadow: 0 2px 0 rgba(0,0,0,0.35);
    letter-spacing: 0.02em;
    cursor: pointer;
    overflow: hidden;
    background: linear-gradient(180deg, #ffc24a 0%, var(--orange) 48%, #e35d00 50%, #c44900 100%);
    box-shadow:
      inset 0 2px 1px rgba(255,255,255,0.55),
      inset 0 -4px 8px rgba(0,0,0,0.25),
      0 8px 0 #8a3300,
      0 16px 26px rgba(0,0,0,0.5);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .btn-premium::after {
    content: "";
    position: absolute; top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(115deg, transparent 0%, rgba(255,255,255,0.55) 50%, transparent 100%);
    animation: shine-sweep 2.8s ease-in-out infinite;
  }
  @keyframes shine-sweep {
    0%   { left: -60%; }
    35%  { left: 130%; }
    100% { left: 130%; }
  }
  .btn-premium:active {
    transform: translateY(5px);
    box-shadow:
      inset 0 2px 1px rgba(255,255,255,0.4),
      0 2px 0 #8a3300,
      0 6px 14px rgba(0,0,0,0.4);
  }

  .gem-row { display: flex; justify-content: center; gap: 10px; margin-top: 18px; }
  .gem-chip {
    display: flex; align-items: center; gap: 5px;
    background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(0,0,0,0.2));
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 99px; padding: 5px 11px;
    font-family: var(--font-display); font-weight: 700; font-size: 0.78rem; color: var(--gold-light);
  }
</style>
</head>
<body>

<div class="section-label">Premium mobile-game — Login</div>
<div class="frame">
  <div class="stage">
    <div class="sparkle" style="width:6px; height:6px; top:12%; left:18%; animation-delay:0s;"></div>
    <div class="sparkle" style="width:4px; height:4px; top:22%; left:75%; animation-delay:1.2s;"></div>
    <div class="sparkle" style="width:8px; height:8px; top:68%; left:12%; animation-delay:2s;"></div>
    <div class="sparkle" style="width:5px; height:5px; top:75%; left:82%; animation-delay:0.6s;"></div>
    <span class="orb" style="top:10%; left:8%; animation-delay:0.3s;">👻</span>
    <span class="orb" style="top:14%; right:8%; animation-delay:1.1s;">⭐</span>
    <span class="orb" style="top:78%; left:9%; animation-delay:0.8s;">💣</span>
    <span class="orb" style="top:80%; right:10%; animation-delay:1.6s;">🍌</span>

    <div class="logo-glow"></div>
    <div class="logo-wrap">
      <img src="../public/logo.png" alt="PointRush" />
    </div>

    <div class="panel">
      <div class="panel-inner">
        <label class="field-label">Naam</label>
        <input class="field-input" placeholder="bijv. groep1" />
        <label class="field-label">Wachtwoord</label>
        <input class="field-input" placeholder="••••••••" type="password" />
        <button class="btn-premium">INLOGGEN →</button>
        <div class="gem-row">
          <span class="gem-chip">⭐ 340</span>
          <span class="gem-chip">🏆 #2</span>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
