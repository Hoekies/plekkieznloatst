<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A1B36" />
    <title>Plekkie z'n Loatst</title>
    <link rel="icon" type="image/png" href="./assets/icons/favicon.png" />
    <link rel="apple-touch-icon" href="./assets/icons/favicon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
:root {
  --bg: #EEF3FB;
  --paper: #FFFFFF;
  --panel: rgba(255, 255, 255, 0.96);
  --ink: #0A1B36;
  --text: #122944;
  --muted: #5B6D8A;
  --blue: #1E40AF;
  --blue-dark: #1E3A8A;
  --blue-soft: rgba(30, 64, 175, 0.12);
  --cyan: #06B6D4;
  --cyan-soft: rgba(6, 182, 212, 0.18);
  --green: #10B981;
  --green-soft: rgba(16, 185, 129, 0.15);
  --red: #EF4444;
  --red-soft: rgba(239, 68, 68, 0.12);
  --gold: #F59E0B;
  --line: rgba(10, 27, 54, 0.12);
  --shadow: 0 18px 44px rgba(10, 27, 54, 0.10);
  --radius-xl: 18px;
  --radius-lg: 14px;
  --radius-md: 10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  font-family: "Aptos", "Segoe UI", Verdana, sans-serif;
  color: var(--text);
  background: linear-gradient(180deg, #EEF3FB 0%, #E2ECF7 100%);
}

/* ── Layout ── */
.app-shell {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 480px;
  margin: 0 auto;
}

/* ── Header ── */
header {
  background: var(--ink);
  color: #fff;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.01em; }
header .subtitle { font-size: 0.72rem; color: rgba(255,255,255,0.55); margin-top: 2px; }

/* ── Tab bar ── */
.tabs {
  display: flex;
  background: var(--ink);
  border-bottom: 2px solid rgba(255,255,255,0.08);
  flex-shrink: 0;
}
.tab-btn {
  flex: 1;
  padding: 10px;
  background: none;
  border: none;
  color: rgba(255,255,255,0.5);
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: color 0.15s, border-color 0.15s;
}
.tab-btn.active {
  color: var(--cyan);
  border-bottom-color: var(--cyan);
}

/* ── Tab panels ── */
.tab-panel { display: none; flex: 1; overflow-y: auto; }
.tab-panel.active { display: flex; flex-direction: column; }

/* ── Kaart ── */
#map {
  width: 100%;
  height: 320px;
  flex-shrink: 0;
}

/* ── Toolbar ── */
.toolbar {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: var(--radius-md);
  border: none;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s;
}
.btn:active { opacity: 0.75; }
.btn-primary { background: var(--blue); color: #fff; }
.btn-cyan { background: var(--cyan); color: #fff; }
.btn-danger { background: var(--red); color: #fff; }
.btn-ghost { background: var(--blue-soft); color: var(--blue); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Waypoint lijst ── */
.waypoint-list {
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
}
.waypoint-card {
  background: var(--paper);
  border-radius: var(--radius-lg);
  border: 1px solid var(--line);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 2px 8px rgba(10,27,54,0.06);
}
.waypoint-card.is-finish { border-color: var(--gold); background: rgba(245,158,11,0.06); }
.waypoint-card.reached { border-color: var(--green); background: var(--green-soft); }
.wp-number {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--blue);
  color: #fff;
  font-size: 0.8rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.wp-number.finish { background: var(--gold); }
.wp-number.reached { background: var(--green); }
.wp-info { flex: 1; min-width: 0; }
.wp-label { font-size: 0.9rem; font-weight: 600; }
.wp-meta { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
.wp-actions { display: flex; gap: 6px; }
.wp-action {
  width: 30px;
  height: 30px;
  border-radius: var(--radius-md);
  border: none;
  cursor: pointer;
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.15s;
}
.wp-action:active { opacity: 0.7; }
.wp-action.edit { background: var(--blue-soft); color: var(--blue); }
.wp-action.delete { background: var(--red-soft); color: var(--red); }

/* ── Spelen tab ── */
#map-spelen { width: 100%; height: 280px; flex-shrink: 0; }

.spelen-header {
  padding: 12px 16px;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.stat-badge {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.stat-badge .value { font-size: 1.1rem; font-weight: 700; color: var(--blue); }
.stat-badge .label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

.spelen-controls {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}

.voortgang {
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.voortgang-bar-outer {
  height: 8px;
  background: var(--line);
  border-radius: 99px;
  overflow: hidden;
}
.voortgang-bar-inner {
  height: 100%;
  background: var(--blue);
  border-radius: 99px;
  transition: width 0.4s ease;
}
.voortgang-label { font-size: 0.8rem; color: var(--muted); }

.punten-spelen {
  padding: 0 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
  overflow-y: auto;
}
.punt-spelen-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--paper);
  border-radius: var(--radius-md);
  border: 1px solid var(--line);
  font-size: 0.85rem;
}
.punt-spelen-item.current { border-color: var(--cyan); background: var(--cyan-soft); }
.punt-spelen-item.done { opacity: 0.6; }

/* ── GPS status ── */
.gps-status {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  font-size: 0.78rem;
  color: var(--muted);
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.gps-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--muted);
  flex-shrink: 0;
}
.gps-dot.active { background: var(--green); animation: pulse 1.5s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ── Modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 27, 54, 0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 20px;
  display: none;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--paper);
  border-radius: var(--radius-xl);
  padding: 28px 24px;
  width: 100%;
  max-width: 400px;
  box-shadow: var(--shadow);
}
.modal-box h2 { font-size: 1.1rem; color: var(--ink); margin-bottom: 6px; }
.modal-box .wp-naam { font-size: 0.8rem; color: var(--muted); margin-bottom: 18px; }
.modal-vraag { font-size: 0.95rem; font-weight: 600; color: var(--ink); margin-bottom: 16px; line-height: 1.4; }
.antwoord-opties { display: flex; flex-direction: column; gap: 8px; }
.antwoord-btn {
  padding: 12px 16px;
  border-radius: var(--radius-md);
  border: 2px solid var(--line);
  background: var(--bg);
  font-size: 0.9rem;
  text-align: left;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.antwoord-btn:hover { border-color: var(--blue); background: var(--blue-soft); }
.antwoord-btn.correct { border-color: var(--green); background: var(--green-soft); color: var(--green); font-weight: 700; }
.antwoord-btn.wrong { border-color: var(--red); background: var(--red-soft); color: var(--red); }
.modal-feedback { margin-top: 14px; font-size: 0.88rem; font-weight: 600; min-height: 20px; }
.modal-verder {
  margin-top: 16px;
  width: 100%;
  padding: 12px;
  border-radius: var(--radius-md);
  border: none;
  background: var(--blue);
  color: #fff;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  display: none;
}
.modal-verder.show { display: block; }

/* ── Eindscherm ── */
.eindscherm {
  position: fixed;
  inset: 0;
  background: var(--ink);
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9998;
  padding: 32px 24px;
  text-align: center;
  display: none;
}
.eindscherm.open { display: flex; }
.eindscherm h1 { font-size: 2rem; margin-bottom: 8px; }
.eindscherm .eind-sub { color: rgba(255,255,255,0.6); margin-bottom: 32px; font-size: 0.9rem; }
.eind-stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 20px;
  margin-bottom: 32px;
}
.eind-stat { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.eind-stat .waarde { font-size: 2rem; font-weight: 800; color: var(--cyan); }
.eind-stat .naam { font-size: 0.75rem; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.06em; }

/* ── Bewerkmodal ── */
.bewerk-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 27, 54, 0.65);
  display: none;
  align-items: flex-end;
  z-index: 9997;
  padding: 0;
}
.bewerk-overlay.open { display: flex; }
.bewerk-sheet {
  background: var(--paper);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  padding: 24px 20px 32px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
}
.bewerk-sheet h2 { font-size: 1rem; font-weight: 700; color: var(--ink); margin-bottom: 16px; }
.form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.form-group label { font-size: 0.78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.form-group input, .form-group textarea, .form-group select {
  padding: 10px 12px;
  border-radius: var(--radius-md);
  border: 1px solid var(--line);
  font-size: 0.9rem;
  font-family: inherit;
  background: var(--bg);
  color: var(--ink);
  outline: none;
}
.form-group input:focus, .form-group textarea:focus, .form-group select:focus {
  border-color: var(--blue);
  background: var(--paper);
}
.form-group textarea { resize: vertical; min-height: 60px; }
.antwoord-inputs { display: flex; flex-direction: column; gap: 6px; }
.antwoord-row { display: flex; gap: 6px; align-items: center; }
.antwoord-row input { flex: 1; }
.antwoord-row .correct-radio { width: 18px; height: 18px; cursor: pointer; accent-color: var(--green); }
.bewerk-footer { display: flex; gap: 8px; margin-top: 16px; }
.bewerk-footer .btn { flex: 1; justify-content: center; }

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
  font-size: 0.9rem;
  line-height: 1.6;
}
.empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header>
        <div>
          <h1>Plekkie z'n Loatst</h1>
          <div class="subtitle">Route &amp; Quiz</div>
        </div>
      </header>

      <div class="tabs">
        <button class="tab-btn active" data-tab="beheer">Beheer</button>
        <button class="tab-btn" data-tab="spelen">Spelen</button>
      </div>

      <!-- ══ BEHEER TAB ══ -->
      <div class="tab-panel active" id="tab-beheer">
        <div id="map"></div>
        <div class="toolbar">
          <button class="btn btn-primary" id="btn-add-mode">
            <span>📍</span> Punt plaatsen
          </button>
          <button class="btn btn-ghost" id="btn-clear-route">
            Wis route
          </button>
        </div>
        <div class="waypoint-list" id="waypoint-list">
          <div class="empty-state">
            <div class="icon">🗺️</div>
            Klik op "Punt plaatsen" en tik daarna op de kaart om een waypoint toe te voegen.
          </div>
        </div>
      </div>

      <!-- ══ SPELEN TAB ══ -->
      <div class="tab-panel" id="tab-spelen">
        <div id="map-spelen"></div>
        <div class="gps-status">
          <div class="gps-dot" id="gps-dot"></div>
          <span id="gps-label">GPS niet actief</span>
        </div>
        <div class="spelen-header">
          <div class="stat-badge">
            <span class="value" id="stat-tijd">00:00</span>
            <span class="label">Tijd</span>
          </div>
          <div class="stat-badge">
            <span class="value" id="stat-km">0.0</span>
            <span class="label">km</span>
          </div>
          <div class="stat-badge">
            <span class="value" id="stat-score">0/0</span>
            <span class="label">Score</span>
          </div>
          <div class="stat-badge">
            <span class="value" id="stat-volgend">—</span>
            <span class="label">Volgend</span>
          </div>
        </div>
        <div class="spelen-controls">
          <button class="btn btn-cyan" id="btn-start">▶ Start route</button>
          <button class="btn btn-ghost" id="btn-stop" disabled>⏹ Stop</button>
        </div>
        <div class="voortgang" id="voortgang-wrap" style="display:none">
          <div class="voortgang-label" id="voortgang-label">0 van 0 punten bereikt</div>
          <div class="voortgang-bar-outer">
            <div class="voortgang-bar-inner" id="voortgang-bar" style="width:0%"></div>
          </div>
        </div>
        <div class="punten-spelen" id="punten-spelen"></div>
      </div>
    </div>

    <!-- ══ VRAAG MODAL ══ -->
    <div class="modal-overlay" id="vraag-modal">
      <div class="modal-box">
        <h2>📍 Punt bereikt!</h2>
        <div class="wp-naam" id="modal-wp-naam"></div>
        <div class="modal-vraag" id="modal-vraag"></div>
        <div class="antwoord-opties" id="antwoord-opties"></div>
        <div class="modal-feedback" id="modal-feedback"></div>
        <button class="modal-verder" id="modal-verder">Verder →</button>
      </div>
    </div>

    <!-- ══ EINDSCHERM ══ -->
    <div class="eindscherm" id="eindscherm">
      <div style="font-size:3rem;margin-bottom:12px">🏁</div>
      <h1>Finish!</h1>
      <div class="eind-sub">Je hebt de route voltooid</div>
      <div class="eind-stats">
        <div class="eind-stat">
          <span class="waarde" id="eind-tijd">00:00</span>
          <span class="naam">Tijd</span>
        </div>
        <div class="eind-stat">
          <span class="waarde" id="eind-km">0.0</span>
          <span class="naam">km</span>
        </div>
        <div class="eind-stat">
          <span class="waarde" id="eind-score">0/0</span>
          <span class="naam">Score</span>
        </div>
      </div>
      <button class="btn btn-cyan" id="btn-opnieuw" style="font-size:1rem;padding:14px 28px">Opnieuw</button>
    </div>

    <!-- ══ BEWERK SHEET ══ -->
    <div class="bewerk-overlay" id="bewerk-overlay">
      <div class="bewerk-sheet">
        <h2 id="bewerk-titel">Punt bewerken</h2>
        <div class="form-group">
          <label>Naam</label>
          <input type="text" id="bewerk-naam" placeholder="bijv. Punt 1 – De Kroeg" />
        </div>
        <div class="form-group">
          <label>Type</label>
          <select id="bewerk-type">
            <option value="waypoint">Normaal punt</option>
            <option value="finish">Finish 🏁</option>
          </select>
        </div>
        <div class="form-group">
          <label>Detectieradius (meter)</label>
          <input type="number" id="bewerk-radius" value="50" min="10" max="500" />
        </div>
        <div class="form-group" id="vraag-groep">
          <label>Vraag (optioneel)</label>
          <textarea id="bewerk-vraag" placeholder="Typ hier je quizvraag..."></textarea>
        </div>
        <div class="form-group" id="antwoorden-groep">
          <label>Antwoorden (selecteer het juiste antwoord)</label>
          <div class="antwoord-inputs" id="antwoord-inputs">
            <!-- 4 rijen: radio + input -->
          </div>
        </div>
        <div class="bewerk-footer">
          <button class="btn btn-ghost" id="bewerk-annuleer">Annuleer</button>
          <button class="btn btn-primary" id="bewerk-opslaan">Opslaan</button>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
